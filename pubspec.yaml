name: bookly
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  cached_network_image: ^3.4.1
  device_preview: ^1.3.1
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_native_splash: ^2.4.7
  font_awesome_flutter: ^10.12.0
  go_router: ^17.0.1
  rxdart: ^0.28.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Tagesschrift
      fonts:
        - asset: assets/fonts/Tagesschrift.ttf
    - family: LibreBaskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville.ttf

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#100B20"
  image: assets/images/light.png
  image_dark: assets/images/dark.png
  android_12:
    color: "#ffffff"
    color_dark: "#100B20"
    image: assets/images/light.png
    image_dark: assets/images/dark.png